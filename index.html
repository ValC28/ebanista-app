<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ebanista">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Ebanista — Production</title>
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Mukta:wght@300;400;600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="ebanista-core.js?v=2.11"></script>
  <style>
    /* ─── Reset & Variables ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: dark;
      --bg:       #000000;
      --card:     #111111;
      --primary:  #E5E5E5;
      --accent:   #575A5F;   /* gris ardoise des boutons du site */
      --accent2:  #8E8E8E;
      --green:    #4CC38A;
      --red:      #FF5A4F;
      --orange:   #F0A050;
      --blue:     #7FA8D9;
      --gray:     #8E8E8E;
      --gray2:    #2A2A2A;
      --gray3:    #1A1A1A;
      --text:     #E5E5E5;
      --text2:    #BDBDBD;
      --text3:    #8E8E8E;
      --radius:   4px;
      --shadow:   none;
      --shadow2:  0 4px 20px rgba(0,0,0,.6);
      --font:       'Raleway', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      --font-title: 'Michroma', 'Arial Black', Arial, sans-serif;
    }
    html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font); font-weight: 400; color: var(--text); -webkit-tap-highlight-color: transparent; }

    /* ─── Layout ────────────────────────────────────────── */
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    .nav-bar { background: #000; border-bottom: 1px solid var(--gray2); padding: env(safe-area-inset-top, 0) 20px 0; display: flex; align-items: center; justify-content: space-between; min-height: 56px; flex-shrink: 0; z-index: 100; }
    .nav-bar h1 { font-family: var(--font-title); font-size: 10px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase; color: var(--text); flex: 1; min-width: 0; margin: 0 12px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-bar svg { filter: grayscale(1) brightness(1.5); }
    .brand { display: flex; flex-direction: column; line-height: 1.1; }
    .brand-name { font-family: var(--font-title); font-size: 15px; letter-spacing: .3em; color: #fff; }
    .brand-sub { font-size: 9px; letter-spacing: .55em; text-transform: uppercase; color: var(--text3); margin-top: 5px; }
    .nav-back { flex-shrink: 0; color: var(--text2); font-size: 16px; font-weight: 400; background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 8px 0; font-family: var(--font); }
    .nav-back::before { content: '‹'; font-size: 22px; line-height: 1; }
    .nav-action { flex-shrink: 0; background: var(--text); color: #000; border: none; border-radius: 3px; padding: 8px 11px; font-family: var(--font); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
    .nav-action.secondary { background: var(--accent); color: #fff; }

    .screen { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px 16px calc(env(safe-area-inset-bottom, 0) + 16px); }

    /* ─── Dashboard ────────────────────────────────────── */
    .dashboard-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .dashboard-title { font-family: var(--font-title); font-size: 18px; font-weight: 400; letter-spacing: .22em; text-transform: uppercase; }
    .btn-new { background: var(--text); color: #000; border: none; border-radius: 3px; padding: 10px 18px; font-family: var(--font); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn-new::before { content: '+'; font-size: 20px; font-weight: 400; }

    .search-bar { background: var(--card); border: 1px solid var(--gray2); border-radius: 3px; padding: 10px 14px; display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
    .search-bar input { background: none; border: none; outline: none; flex: 1; font-size: 16px; color: var(--text); }
    .search-bar::before { content: '⌕'; font-size: 18px; color: var(--gray); }

    .section-label { font-size: 12px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 8px; padding-left: 4px; }

    .project-card { background: var(--card); border: 1px solid var(--gray2); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: transform .1s, border-color .15s; }
    .project-card:active { transform: scale(.98); }
    .project-icon { display: none; }
    .project-info { flex: 1; min-width: 0; }
    .project-info h3 { font-family: var(--font-title); font-size: 11px; font-weight: 400; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-info p { font-size: 13px; color: var(--text3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-status { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .status-badge { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 2px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
    .status-0 { background: #1F1F1F; color: #8E8E8E; }
    .status-1 { background: #2A2314; color: #D2A94A; }
    .status-2 { background: #12281D; color: #5DC98B; }
    .status-3 { background: #2C1B12; color: #E5915F; }
    .status-4 { background: #262626; color: #BDBDBD; }
    .chevron { color: var(--gray); font-size: 18px; }

    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state .icon { font-family: var(--font-title); font-size: 15px; letter-spacing: .4em; color: var(--accent); margin-bottom: 18px; }
    .empty-state h3 { font-family: var(--font-title); font-size: 12px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 8px; }
    .empty-state p { font-size: 15px; color: var(--text3); }

    /* ─── Project View ──────────────────────────────────── */
    .tab-bar { display: flex; background: #000; border-bottom: 1px solid var(--gray2); overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; flex-shrink: 0; }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab { padding: 14px 13px; font-family: var(--font-title); font-size: 9px; font-weight: 400; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); white-space: nowrap; border-bottom: 1px solid transparent; cursor: pointer; transition: all .2s; flex-shrink: 0; display: flex; align-items: center; gap: 7px; }
    .tab.active { color: #fff; border-bottom-color: #fff; }
    .tab-badge { font-size: 10px; font-weight: 700; min-width: 17px; height: 17px; border-radius: 9px; padding: 0 4px; display: inline-flex; align-items: center; justify-content: center; background: var(--red); color: white; }
    .tab-badge.done { background: var(--green); }
    .tab-count { font-size: 10px; font-weight: 700; min-width: 17px; height: 17px; border-radius: 9px; padding: 0 4px; display: inline-flex; align-items: center; justify-content: center; background: var(--gray2); color: var(--text3); }
    .dash-tab-bar .tab.active .tab-count { background: var(--text); color: #000; }

    /* ─── Form Styles ───────────────────────────────────── */
    .form-section { background: var(--card); border: 1px solid var(--gray2); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
    .form-section-title { font-family: var(--font-title); font-size: 10px; font-weight: 400; color: var(--text3); text-transform: uppercase; letter-spacing: .18em; padding: 16px 16px 2px; }
    .form-row { padding: 12px 16px; border-bottom: 1px solid var(--gray2); display: flex; align-items: center; gap: 12px; }
    .form-row:last-child { border-bottom: none; }
    .form-label { font-size: 15px; color: var(--text2); flex-shrink: 0; min-width: 120px; }
    .form-label.wide { min-width: 160px; }
    .form-input { flex: 1; border: none; outline: none; font-size: 15px; color: var(--text); background: none; text-align: right; font-family: var(--font); }
    .form-input::placeholder { color: var(--text3); }
    .form-input.full { text-align: left; }
    textarea.form-input { resize: none; min-height: 80px; padding: 4px 0; text-align: left; }
    select.form-input { text-align: right; appearance: none; -webkit-appearance: none; }

    .checkbox-row { padding: 13px 16px; border-bottom: 1px solid var(--gray2); display: flex; align-items: center; gap: 12px; cursor: pointer; width: 100%; background: none; border-left: none; border-right: none; border-top: none; text-align: left; font-family: var(--font); font-size: inherit; color: var(--text); -webkit-appearance: none; touch-action: manipulation; }
    .checkbox-row:last-child { border-bottom: none; }
    .checkbox-row:active { background: var(--gray3); }
    .checkbox { width: 24px; height: 24px; border-radius: 3px; border: 1.5px solid var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .15s; }
    .checkbox.checked { background: var(--text); border-color: var(--text); }
    .checkbox.checked::after { content: '✓'; color: #000; font-size: 14px; font-weight: 700; }
    .checkbox-label { font-size: 15px; color: var(--text); flex: 1; line-height: 1.4; }
    .checkbox-label.checked { color: var(--text3); text-decoration: line-through; }

    /* ─── Photo Capture ─────────────────────────────────── */
    .photo-section { padding: 16px; }
    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .photo-thumb { aspect-ratio: 1; border-radius: 8px; overflow: hidden; position: relative; background: var(--gray2); }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .photo-thumb .del { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.6); color: white; border: none; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .photo-thumb .photo-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.5); color: white; font-size: 10px; padding: 3px 4px; text-align: center; }
    .photo-actions { display: flex; gap: 10px; }
    .btn-photo { flex: 1; background: var(--accent); color: #fff; border: none; border-radius: 3px; padding: 12px; font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-photo.secondary { background: var(--gray3); color: var(--text); border: 1px solid var(--gray2); }
    input[type="file"] { display: none; }

    /* ─── Status Steps ──────────────────────────────────── */
    .steps-container { padding: 16px; }
    .step { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
    .step-num { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--gray2); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--text3); flex-shrink: 0; transition: all .2s; cursor: pointer; }
    .step-num.done { background: var(--green); border-color: var(--green); color: white; }
    .step-num.done::after { content: '✓'; }
    .step-num.done span { display: none; }
    .step-num.active { border-color: var(--accent); color: var(--accent); }
    .step-line { width: 2px; background: var(--gray2); flex: 1; margin: 4px 0 4px 14px; min-height: 20px; }
    .step-line.done { background: var(--green); }
    .step-content { flex: 1; padding-top: 5px; }
    .step-title { font-size: 15px; font-weight: 500; }
    .step-title.done { color: var(--text3); text-decoration: line-through; }

    /* ─── Signature ─────────────────────────────────────── */
    .signature-area { background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); margin-bottom: 16px; }
    .signature-title { font-size: 15px; font-weight: 600; padding: 14px 16px; border-bottom: 1px solid var(--gray2); }
    .sig-row { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--gray2); }
    .sig-row:last-child { border-bottom: none; }
    .sig-field { flex: 1; }
    .sig-label { font-size: 12px; color: var(--text3); margin-bottom: 6px; }
    .sig-input { border: none; border-bottom: 1px solid var(--gray2); outline: none; font-size: 15px; width: 100%; padding: 4px 0; background: none; font-family: var(--font); }
    .sig-canvas { border: 1px dashed var(--gray2); border-radius: 8px; width: 100%; height: 80px; cursor: crosshair; touch-action: none; background: var(--gray3); }
    .sig-canvas.signed { border-color: var(--green); background: #f0fdf4; }
    .sig-clear { background: none; border: none; color: var(--red); font-size: 13px; cursor: pointer; margin-top: 4px; }

    /* ─── RACI Table ────────────────────────────────────── */
    .raci-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .raci-table th { background: var(--gray3); padding: 8px 10px; font-weight: 600; text-align: left; font-size: 12px; color: var(--text3); }
    .raci-table td { padding: 8px 10px; border-bottom: 1px solid var(--gray2); }
    .raci-table input { border: none; outline: none; background: none; font-size: 13px; width: 100%; font-family: var(--font); }
    .raci-table-wrap { overflow-x: auto; padding: 0 16px 16px; }

    /* ─── Furniture Table ───────────────────────────────── */
    .furniture-list { padding: 0 16px 16px; }
    .furniture-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--gray2); }
    .furniture-item:last-child { border-bottom: none; }
    .furniture-num { width: 28px; height: 28px; border-radius: 3px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .furniture-input { flex: 1; border: none; outline: none; font-size: 15px; background: none; font-family: var(--font); }
    .furniture-qty { width: 50px; border: none; border-bottom: 1px solid var(--gray2); outline: none; font-size: 14px; text-align: center; background: none; font-family: var(--font); }
    .furniture-check { width: 24px; height: 24px; border-radius: 3px; border: 1.5px solid var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .15s; flex-shrink: 0; }
    .furniture-check.done { background: var(--text); border-color: var(--text); }
    .furniture-check.done::after { content: '✓'; color: #000; font-size: 14px; font-weight: 700; }
    .furniture-del { background: none; border: none; color: var(--red); font-size: 20px; cursor: pointer; padding: 0 4px; }
    .btn-add-row { background: none; border: none; color: var(--text); font-family: var(--font); font-size: 14px; font-weight: 500; cursor: pointer; padding: 10px 0; display: flex; align-items: center; gap: 6px; }
    .btn-add-row::before { content: '+'; font-size: 18px; }

    /* ─── Progress Ring ─────────────────────────────────── */
    .progress-ring { display: flex; align-items: center; justify-content: center; padding: 16px; }
    .progress-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .progress-card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); text-align: center; }
    .progress-card .value { font-size: 28px; font-weight: 700; }
    .progress-card .label { font-size: 12px; color: var(--text3); margin-top: 4px; }
    .progress-bar-wrap { background: var(--gray2); border-radius: 4px; height: 8px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s; }

    /* ─── Modal ─────────────────────────────────────────── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; display: flex; align-items: flex-end; backdrop-filter: blur(4px); animation: fadeIn .2s; }
    .modal { background: var(--card); border-top: 1px solid var(--gray2); border-radius: 12px 12px 0 0; padding: 20px; padding-bottom: calc(env(safe-area-inset-bottom) + 20px); width: 100%; max-height: 90vh; overflow-y: auto; animation: slideUp .25s; }
    .modal-handle { width: 36px; height: 4px; background: var(--gray2); border-radius: 2px; margin: 0 auto 20px; }
    .modal h2 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }

    /* ─── PIN Modal ──────────────────────────────────────── */
    .pin-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 400; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(6px); animation: fadeIn .2s; }
    .pin-modal { background: var(--card); border: 1px solid var(--gray2); border-radius: 8px; padding: 28px 24px 24px; width: 320px; max-width: 90vw; animation: pinPop .2s; text-align: center; }
    @keyframes pinPop { from { transform: scale(.9); opacity: 0 } to { transform: scale(1); opacity: 1 } }
    .pin-modal h3 { font-family: var(--font-title); font-size: 12px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 8px; }
    .pin-modal p { font-size: 14px; color: var(--text3); margin-bottom: 20px; }
    .pin-dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 16px; }
    .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--gray2); background: transparent; transition: background .15s, border-color .15s; }
    .pin-dot.filled { background: var(--text); border-color: var(--text); }
    .pin-dot.error { background: var(--red); border-color: var(--red); }
    .pin-error { font-size: 13px; color: var(--red); margin-bottom: 12px; min-height: 18px; }
    .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .pin-key { background: var(--gray3); color: var(--text); border: 1px solid var(--gray2); border-radius: 4px; height: 56px; font-size: 22px; font-weight: 400; font-family: var(--font); cursor: pointer; touch-action: manipulation; transition: background .1s; }
    .pin-key:active { background: var(--accent); }
    .pin-key.del { font-size: 18px; }
    .pin-key.cancel { background: none; font-size: 15px; color: var(--text3); }
    .pin-modal .del-btn { margin-top: 16px; background: var(--red); color: white; border: none; border-radius: 12px; padding: 14px; width: 100%; font-size: 16px; font-weight: 600; font-family: var(--font); cursor: pointer; touch-action: manipulation; }
    .card-del-btn { background: none; border: none; padding: 8px; cursor: pointer; color: var(--gray); touch-action: manipulation; font-size: 18px; flex-shrink: 0; }
    .card-del-btn:active { color: var(--red); }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }

    /* ─── Toast ─────────────────────────────────────────── */
    .toast { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 90px); left: 50%; transform: translateX(-50%); background: var(--text); color: #000; padding: 10px 18px; border-radius: 3px; font-size: 13px; font-weight: 600; letter-spacing: .04em; z-index: 300; animation: toastIn .3s; white-space: nowrap; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px) } to { opacity: 1; transform: translateX(-50%) translateY(0) } }

    /* ─── Bottom Tab Bar ────────────────────────────────── */
    .bottom-tabs { display: flex; background: rgba(255,255,255,.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--gray2); padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; }
    .bottom-tab { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 0 4px; cursor: pointer; color: var(--gray); gap: 2px; transition: color .15s; }
    .bottom-tab.active { color: var(--accent); }
    .bottom-tab .icon { font-size: 22px; }
    .bottom-tab .label { font-size: 10px; font-weight: 500; }

    /* ─── Misc ──────────────────────────────────────────── */
    .divider { height: 1px; background: var(--gray2); margin: 8px 0; }
    .date-badge { font-size: 12px; color: var(--text3); }
    .info-banner { background: var(--card); border-left: 3px solid var(--accent2); padding: 12px 16px; border-radius: 4px; font-size: 14px; margin-bottom: 16px; }
    .badge-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    /* ─── Print ─────────────────────────────────────────── */
    @media print {
      body { margin: 0; background: white; color: black; font-family: Arial, sans-serif; }
      #app { display: none !important; }
      #bonLivraison { display: block !important; }
    }

    /* ─── Bon de Livraison ───────────────────────────────── */
    #bonLivraison {
      display: none;
      font-family: 'Mukta', Arial, sans-serif;
      font-weight: 300;
      font-size: 11pt;
      color: #111;
      max-width: 800px;
      margin: 0 auto;
      padding: 28px 32px;
    }
    .bl-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid #111;
      padding-bottom: 14px;
      margin-bottom: 20px;
    }
    .bl-logo { font-size: 10pt; line-height: 1.6; }
    .bl-logo strong { font-family: 'Michroma', Arial, sans-serif; font-weight: 400; font-size: 13pt; letter-spacing: .3em; color: #111; display: block; }
    .bl-doc-title { text-align: right; }
    .bl-doc-title h1 { font-family: 'Michroma', Arial, sans-serif; font-size: 10pt; font-weight: 400; text-transform: uppercase; letter-spacing: .16em; margin-bottom: 4px; }
    .bl-doc-title p { font-size: 10pt; color: #555; }
    .bl-parties {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 18px;
    }
    .bl-parties td {
      width: 50%;
      vertical-align: top;
      padding: 12px 14px;
      border: 1px solid #ccc;
      font-size: 10pt;
      line-height: 1.7;
    }

<body>
<div id="app"></div>

<!-- Camera input (hidden) -->
<input type="file" id="cameraInput" accept="image/*" capture="environment" multiple>
<input type="file" id="galleryInput" accept="image/*" multiple>
<input type="file" id="importFileInput" accept="application/json,.json">

<script>
// ═══════════════════════════════════════════════════════
//  EBANISTA — Production Manager v1.0
// ═══════════════════════════════════════════════════════

let state = {
  screen: 'dashboard',
  dashboardTab: 0, // onglet actif du dashboard (0-4 → DASH_TABS)
  projects: [],
  deletedIds: {},      // { id: timestamp } — tombstones pour la sync multi-appareils
  trash: [],            // [{ ...project, deletedAt }] — corbeille récupérable (locale, 30 jours)
  currentProject: null,
  currentTab: 0,
  search: '',
  lastModified: 0,
};

const TRASH_RETENTION_MS = 30 * 24 * 60 * 60 * 1000; // 30 jours

// ── Persistence ──────────────────────────────────────
function save() {
  state.lastModified = Date.now();
  // Horodater le projet en cours d'édition pour la résolution de conflits
  if (state.screen === 'project' && state.currentProject) {
    const p = getProject(state.currentProject);
    if (p) p.updatedAt = state.lastModified;
  }
  try {
    localStorage.setItem('ebanista_v1', JSON.stringify(state.projects));
    localStorage.setItem('ebanista_v1_ts', state.lastModified);
    localStorage.setItem('ebanista_v1_del', JSON.stringify(state.deletedIds));
    localStorage.setItem('ebanista_v1_trash', JSON.stringify(state.trash));
  } catch(e) {}
  if (_driveClientId && _driveToken) drivePush();
}
function load() {
  try {
    const d = localStorage.getItem('ebanista_v1');
    if (d) state.projects = JSON.parse(d);
    state.projects.forEach(ensureJalons);
    const ts = localStorage.getItem('ebanista_v1_ts');
    if (ts) state.lastModified = parseInt(ts);
    const del = localStorage.getItem('ebanista_v1_del');
    if (del) state.deletedIds = JSON.parse(del);
    const tr = localStorage.getItem('ebanista_v1_trash');
    if (tr) state.trash = JSON.parse(tr);
    // Purge auto des éléments de la corbeille plus vieux que 30 jours
    const now = Date.now();
    const before = state.trash.length;
    state.trash = state.trash.filter(t => (now - (t.deletedAt || 0)) < TRASH_RETENTION_MS);
    if (state.trash.length !== before) {
      localStorage.setItem('ebanista_v1_trash', JSON.stringify(state.trash));
    }
  } catch(e) {}
}

// ─── Export / Import (sauvegarde locale) ──────────────
let _pendingImport = null;

function exportData() {
  const payload = {
    app: 'ebanista', version: 1, exportedAt: Date.now(),
    projects: state.projects, deletedIds: state.deletedIds, trash: state.trash,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ebanista-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  document.getElementById('driveSetupOverlay')?.remove();
  toast('Sauvegarde exportée');
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = e => {
    let data;
    try { data = JSON.parse(e.target.result); }
    catch(err) { toast('Fichier invalide'); return; }
    if (!data || !Array.isArray(data.projects)) { toast('Format de sauvegarde invalide'); return; }
    _pendingImport = data;
    document.getElementById('driveSetupOverlay')?.remove();
    _showPinModal(
      '⚠️ Importer une sauvegarde',
      `Remplace les <strong>${state.projects.length}</strong> projet(s) actuel(s) par les <strong>${data.projects.length}</strong> projet(s) du fichier. Entrez le code PIN pour confirmer.`,
      () => {
        state.projects = _pendingImport.projects;
        state.projects.forEach(ensureJalons);
        state.deletedIds = _pendingImport.deletedIds || {};
        state.trash = _pendingImport.trash || state.trash;
        _pendingImport = null;
        save();
        state.screen = 'dashboard';
        render();
        toast('✓ Sauvegarde importée');
      }
    );
  };
  reader.readAsText(file);
}

// ── Helpers ───────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('fr-FR'); }
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}
function getProject(id) { return state.projects.find(p => p.id === id); }

// ── Project Factory ───────────────────────────────────
function newProject() {
  return {
    id: uid(),
    createdAt: Date.now(),
    updatedAt: Date.now(),
    status: 0,
    archived: false,
    archivedAt: null,
    // ── Identification ──
    identification: {
      codeProjet: '',
      codeLegacy: '',
      nomProjet: '',
      client: '',
      adresseChantier: '',
      dateOuverture: '',
      dateLivraison: '',
      commercial: '',
      dessinateurBE: '',
      chefAtelier: '',
      responsablePose: '',
      statutAvancement: [false,false,false,false,false,false],
      checklistDoc: [false,false,false,false,false,false,false,false],
      synthese: '',
      validationLancement: '',
      validationPose: '',
      validationDate: '',
    },
    // ── Lancement Production ──
    lancement: {
      raci: [
        { tache:'Plans techniques', verifie:'', valide:'', informe:'', prepare:'' },
        { tache:'Fichiers CNC', verifie:'', valide:'', informe:'', prepare:'' },
        { tache:'Liste quincaillerie', verifie:'', valide:'', informe:'', prepare:'' },
        { tache:'Spécificités chantier', verifie:'', valide:'', informe:'', prepare:'' },
      ],
      dossierTech: [false,false,false,false,false],
      fichiersProd: [false,false,false,false,false,false],
      matieresFourn: [false,false,false,false,false],
      pointsCritiques: [false,false,false,false,false],
      observations: '',
      receptionSemaine: '',
      dateReception: '',
      respBE: '', respBEDate: '',
      respProd: '', respProdDate: '',
    },
    // ── Contrôle Atelier ──
    atelier: {
      dateControle: '',
      dateDebut: '', dateFin: '',
      meubles: [],
      quincaillerie: [
        { label:'Poignées', done:false },
        { label:'Charnières', done:false },
        { label:'Coulisses', done:false },
        { label:'Visserie spécifique chantier', done:false },
        { label:'Pieds de meubles', done:false },
        { label:'Plinthes', done:false },
        { label:'Accessoires intérieurs', done:false },
        { label:'Éléments spéciaux / sur-mesure', done:false },
      ],
      controleQualite: [
        { label:'Dimensions conformes aux plans', done:false },
        { label:'Aspect visuel / finitions contrôlés', done:false },
        { label:'Assemblages vérifiés', done:false },
        { label:'Éléments complets par meuble', done:false },
        { label:'Protection et emballage réalisés', done:false },
        { label:'Étiquetage chantier apposé', done:false },
        { label:'Chargement prêt à partir', done:false },
      ],
      observations: '',
      nomValidateur: '', dateValidation: '',
    },
    // ── Dossier de Pose ──
    pose: {
      dateDebut: '', dateFin: '',
      typeEquipe: 'Interne', nomEntrepriseST: '', rcProFournie: false, autresCorps: false,
      documentsTransmis: [false,false,false,false,false,false],
      verificationsAvant: [false,false,false,false,false,false],
      suiviInstallation: [false,false,false,false,false],
      reserves: '', reservesClient: '',
      poseConforme: false, reservesEmises: false,
      respPose: '', respPoseDate: '',
      client2: '', clientDate: '',
    },
    // ── Jalons de suivi (remplacent les listes de cases à cocher) ──
    jalons: {
      plans:false, cnc:false, matieresCommandees:false,
      matieresRecues:false, fabrique:false, controle:false,
      docsTransmis:false, posee:false, reservesLevees:false,
    },
    // ── Photos ──
    photos: {
      identification: [],
      lancement: [],
      atelier: [],
      pose: [],
    },
  };
}

// ═══ RENDER ENGINE ════════════════════════════════════
function render() {
  const app = document.getElementById('app');
  if (state.screen === 'dashboard') {
    app.innerHTML = renderDashboard();
  } else if (state.screen === 'project') {
    app.innerHTML = renderProject();
  } else if (state.screen === 'trash') {
    app.innerHTML = renderTrash();
  }
  attachEvents();
}

// ─── Dashboard ────────────────────────────────────────
const DASH_TABS = ['Nouveau','En étude','En production','Prêt à livrer','Clôturé'];

function switchDashboardTab(i) {
  state.dashboardTab = i;
  render();
}

function renderDashboard() {
  const q = state.search.toLowerCase();
  const searched = state.projects.filter(p => {
    return !q || projectRef(p).toLowerCase().includes(q)
              || (p.identification.codeLegacy||'').toLowerCase().includes(q)
              || (p.identification.client||'').toLowerCase().includes(q)
              || (p.identification.adresseChantier||'').toLowerCase().includes(q)
              || (p.identification.responsablePose||'').toLowerCase().includes(q)
              || (p.identification.chefAtelier||'').toLowerCase().includes(q)
              || (p.identification.synthese||'').toLowerCase().includes(q);
  });
  const byTab = [0,1,2,3,4].map(s => searched.filter(p => getDisplayStatus(p) === s));
  const currentTab = state.dashboardTab || 0;
  const filtered = byTab[currentTab];
  const alertBanner = renderDeliveryAlertBanner(state.projects.filter(p => !p.archived));

  let html = `
  <div id="app">
    <div class="nav-bar">
      <div class="brand"><span class="brand-name">EBANISTA</span><span class="brand-sub">Agencement</span></div>
      <div style="position:relative;display:inline-flex">
        <button onclick="showPinForDrive()" style="background:none;border:none;cursor:pointer;padding:4px;touch-action:manipulation;opacity:${_driveClientId?'1':'.45'}" title="Google Drive">
          <svg width="22" height="22" viewBox="0 0 87.3 78" xmlns="http://www.w3.org/2000/svg"><path d="M6.6 66.85l3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8H0c0 1.55.4 3.1 1.2 4.5z" fill="#0066DA"/><path d="M43.65 25L29.9 1.2C28.55 2 27.4 3.1 26.6 4.5L1.2 48.55C.4 49.95 0 51.5 0 53.05h27.5z" fill="#00AC47"/><path d="M73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5H59.8l7.75 20.8z" fill="#EA4335"/><path d="M43.65 25L57.4 1.2C56.05.4 54.5 0 52.9 0H34.4c-1.6 0-3.15.45-4.5 1.2z" fill="#00832D"/><path d="M59.8 53.05H27.5L13.75 76.85c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684FC"/><path d="M73.4 26.5l-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3L43.65 25l16.15 28.05H87.3c0-1.55-.4-3.1-1.2-4.5z" fill="#FFBA00"/></svg>
        </button>
        ${_driveClientId ? `<div id="syncDot" style="position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:${{idle:'#8E8E93',syncing:'#FF9500',ok:'#34C759',error:'#FF3B30'}[_syncStatus]||'#8E8E93'};border:2px solid var(--card);pointer-events:none"></div>` : ''}
      </div>
    </div>
    <div class="screen" style="padding-top:16px;flex:none">
      <div class="dashboard-header">
        <div class="dashboard-title">Projets</div>
        <div style="display:flex;gap:8px;align-items:center">
          ${_driveClientId ? `
          <button onclick="_driveAuth(()=>drivePull())"
            style="background:var(--gray3);border:none;border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer;touch-action:manipulation;color:var(--text2);display:flex;align-items:center;justify-content:center"
            title="Synchroniser depuis Drive">↻</button>` : ''}
          <button class="btn-new" onclick="openNewProject()">Nouveau</button>
        </div>
      </div>
      <div class="search-bar">
        <input type="search" placeholder="Rechercher…" value="${state.search}"
          oninput="state.search=this.value;renderDebounced()">
      </div>
      ${alertBanner}
    </div>
    <div class="tab-bar dash-tab-bar">
      ${DASH_TABS.map((t,i) => `<div class="tab${i===currentTab?' active':''}" onclick="switchDashboardTab(${i})">${t}<span class="tab-count">${byTab[i].length}</span></div>`).join('')}
    </div>
    <div class="screen">
  `;

  if (filtered.length === 0) {
    html += `<div class="empty-state">
      <div class="icon">EBANISTA</div>
      <h3>${state.search ? 'Aucun résultat' : 'Aucun projet dans « ' + DASH_TABS[currentTab] + ' »'}</h3>
      <p>${state.search ? 'Modifiez votre recherche' : (currentTab === 0 ? 'Créez votre premier projet de fabrication' : 'Les projets apparaîtront ici automatiquement selon leur avancement')}</p>
    </div>`;
  } else {
    for (const p of filtered) {
      const prog = calcProgress(p);
      const displayStatus = getDisplayStatus(p);
      html += `
      <div class="project-card" onclick="openProject('${p.id}')">
        <div class="project-info">
          <h3>${projectRef(p) || 'Sans référence'}${p.identification.nomProjet ? ' — ' + p.identification.nomProjet : ''}</h3>
          <p>${p.identification.client || 'Client non renseigné'} · ${p.identification.adresseChantier || '—'}</p>
          <div style="margin-top:6px">
            <div class="progress-bar-wrap">
              <div class="progress-bar" style="width:${prog}%;background:${progressColor(prog)}"></div>
            </div>
            ${deliveryBadgeHTML(p.identification?.dateLivraison)}
          </div>
        </div>
        <div class="project-status">
          <span class="status-badge status-${displayStatus}">${DASH_TABS[displayStatus]}</span>
          <span class="date-badge">${fmt(p.archivedAt || p.createdAt)}</span>
        </div>
        <button class="card-del-btn" onclick="event.stopPropagation();showDeleteModal('${p.id}')" title="Supprimer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg></button>
      </div>`;
    }
  }
  html += `</div></div>`;
  return html;
}

let renderTimer;
function renderDebounced() { clearTimeout(renderTimer); renderTimer = setTimeout(render, 150); }

// calcProgress, progressColor, workingDaysLeft → ebanista-core.js

// ─── Badge livraison (dashboard mobile) ───────────────

function deliveryBadgeHTML(dateStr) {
  if (!dateStr) return '';
  const days = workingDaysLeft(dateStr);
  if (days === null) return '';
  let bg, color, text;
  if (days === -1)     { bg = 'var(--red)';                    color = '#fff';           text = '⚠ Retard'; }
  else if (days === 0) { bg = 'rgba(255,59,48,.15)';           color = 'var(--red)';     text = "Aujourd'hui"; }
  else if (days <= 3)  { bg = 'rgba(255,59,48,.12)';           color = 'var(--red)';     text = days + ' j. ouv.'; }
  else if (days <= 7)  { bg = 'rgba(255,149,0,.12)';           color = 'var(--orange)';  text = days + ' j. ouv.'; }
  else                 { bg = 'rgba(52,199,89,.12)';           color = 'var(--green)';   text = days + ' j. ouv.'; }
  return `<span style="display:inline-block;margin-top:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;background:${bg};color:${color}">${text}</span>`;
}

// ─── Bandeau d'alerte de livraison (proactif) ─────────
function renderDeliveryAlertBanner(projects) {
  let late = 0, soon = 0;
  for (const p of projects) {
    const d = p.identification?.dateLivraison;
    if (!d) continue;
    const days = workingDaysLeft(d);
    if (days === null) continue;
    if (days === -1) late++;
    else if (days <= 3) soon++;
  }
  if (late === 0 && soon === 0) return '';
  const parts = [];
  if (late > 0) parts.push(`<strong>${late}</strong> projet${late>1?'s':''} en retard`);
  if (soon > 0) parts.push(`<strong>${soon}</strong> à livrer sous 3 j. ouv.`);
  const bg = late > 0 ? '#FFE5E3' : '#FFF3D0';
  const border = late > 0 ? 'var(--red)' : 'var(--orange)';
  const color = late > 0 ? '#C1291F' : '#111';
  return `<div style="background:${bg};border-left:3px solid ${border};color:${color};padding:12px 16px;border-radius:8px;font-size:14px;margin-bottom:16px">
    ⚠ ${parts.join(' · ')}
  </div>`;
}

// ─── Project View ─────────────────────────────────────
const TABS = ['Projet','Lancement','Atelier','Pose'];

function tabProgress(p, i) {
  const group = [null, 'lancement', 'atelier', 'pose'][i];
  return group ? _groupProgress(p, group) : { done: 0, total: 0 };
}

function renderProject() {
  const p = getProject(state.currentProject);
  if (!p) { state.screen = 'dashboard'; return renderDashboard(); }

  const tabs = TABS.map((t,i) => {
    const prog = tabProgress(p, i);
    let badge = '';
    if (prog.total > 0) {
      const rem = prog.total - prog.done;
      if (rem === 0) badge = `<span class="tab-badge done">✓</span>`;
      else           badge = `<span class="tab-badge">${rem}</span>`;
    }
    return `<div class="tab${i===state.currentTab?' active':''}" onclick="switchTab(${i})">${t}${badge}</div>`;
  }).join('');
  let content = '';
  if (state.currentTab === 0) content = renderIdentification(p);
  else if (state.currentTab === 1) content = renderLancement(p);
  else if (state.currentTab === 2) content = renderAtelier(p);
  else if (state.currentTab === 3) content = renderPose(p);

  const displayStatus = getDisplayStatus(p);
  let closeBtn = '';
  if (p.archived) {
    closeBtn = `<button class="nav-action secondary" onclick="reopenProject('${p.id}')">↩ Réouvrir</button>`;
  } else if (displayStatus === 3) {
    closeBtn = `<button class="nav-action" style="background:var(--accent);color:#fff" onclick="closeProject('${p.id}')">✓ Clôturer</button>`;
  }

  return `
  <div id="app">
    <div class="nav-bar">
      <button class="nav-back" onclick="goBack()">Projets</button>
      <h1>${p.identification.nomProjet || projectRef(p) || 'Nouveau projet'}</h1>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="card-del-btn" onclick="showDeleteModal('${p.id}')" title="Supprimer" style="padding:4px 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg></button>
        ${state.currentTab === 3 ? `<button class="nav-action" style="background:var(--accent);color:#fff" onclick="printProject('${p.id}')">Bon de livraison</button>` : ''}
        ${closeBtn}
        <button class="nav-action" onclick="saveAndToast()">Enregistrer</button>
      </div>
    </div>
    <div class="tab-bar">${tabs}</div>
    <div class="screen">${content}</div>
  </div>`;
}

// ─── Clôture / Archivage ───────────────────────────────
function closeProject(id) {
  const p = getProject(id);
  if (!p) return;
  p.archived = true;
  p.archivedAt = Date.now();
  save();
  state.screen = 'dashboard';
  state.dashboardTab = 4;
  render();
  toast('✓ Projet clôturé');
}

function reopenProject(id) {
  const p = getProject(id);
  if (!p) return;
  p.archived = false;
  p.archivedAt = null;
  save();
  render();

// ─── Référence projet CL-xxxx (identique au Drive) ────
function _applyCode(input, pad) {
  let digits = input.value.replace(/\D/g, '').slice(0, 4);
  if (pad && digits) digits = digits.padStart(4, '0');
  if (input.value !== digits) input.value = digits;
  const p = getProject(state.currentProject);
  if (!p) return;
  const id = p.identification;
  const old = id.codeProjet || '';
  // Conserver l'ancienne référence EBA-… pour mémoire
  if (old && old !== 'EBA-' && !/^CL-/.test(old) && !id.codeLegacy) id.codeLegacy = old;
  id.codeProjet = digits ? 'CL-' + digits : '';
  const h1 = document.querySelector('.nav-bar h1');
  if (h1) h1.textContent = id.nomProjet || projectRef(p) || 'Nouveau projet';
}
function onCodeProjetInput(input) { _applyCode(input, false); }
function onCodeProjetChange(input) { _applyCode(input, true); save(); }

// ─── SHA-256 via SubtleCrypto (natif, compatible iOS Safari) ──
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function showDeleteModal(projectId) {
  _pinTarget = projectId;

  _showPinModal(

      const idToDelete = _pinTarget;

      if (state.screen === 'project' && state.currentProject === idToDelete) {
        state.screen = 'dashboard';
      }
      save();
      render();
      toast('Projet supprimé — récupérable dans la corbeille (30 j.)');
    }
  );

function openTrash() {

function renderTrash() {
  const items = [...state.trash].sort((a,b) => b.deletedAt - a.deletedAt);
  const rows = items.length === 0
    ? `<div class="empty-state"><div class="icon">CORBEILLE</div><h3>Corbeille vide</h3><p>Les projets supprimés apparaissent ici pendant 30 jours</p></div>`
    : items.map(p => {
        const daysLeft = 30 - Math.floor((Date.now() - p.deletedAt) / 86400000);
        return `
        <div class="project-card" style="cursor:default">
          <div class="project-info">

          <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">
            <button class="nav-action" style="font-size:13px;padding:6px 10px" onclick="restoreProject('${p.id}')">Restaurer</button>
            <button class="card-del-btn" onclick="purgeTrashItem('${p.id}')" title="Supprimer définitivement"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg></button>
          </div>
        </div>`;
      }).join('');

  return `
  <div id="app">
    <div class="nav-bar">
      <button class="nav-back" onclick="state.screen='dashboard';render()">Projets</button>
      <h1>Corbeille</h1>
      <div></div>
    </div>
    <div class="screen" style="padding-top:16px">${rows}</div>
  </div>`;
}

function restoreProject(id) {
  const i = state.trash.findIndex(p => p.id === id);
  if (i === -1) return;
  const [p] = state.trash.splice(i, 1);
  delete p.deletedAt;
  state.projects.unshift(p);
  delete state.deletedIds[id]; // annule le tombstone pour que la sync ne re-supprime pas
  save();
  render();
  toast('✓ Projet restauré');
}

function purgeTrashItem(id) {
  state.trash = state.trash.filter(p => p.id !== id);
  save();
  render();
  toast('Supprimé définitivement');
}

function showPinSetupOverlay(isChange = false) {
  _pinSetupStep  = 1;
  _pinSetupFirst = '';
  _pinEntry      = '';
  const ov = document.createElement('div');
  ov.id = 'pinSetupOv';
  ov.className = 'pin-overlay';
  ov.innerHTML = `
    <div class="pin-modal" onclick="event.stopPropagation()">
      <h3>🔐 ${isChange ? 'Modifier le code PIN' : 'Créer votre code PIN'}</h3>
      <p id="pinSetupMsg">${isChange ? 'Entrez votre nouveau code à 4 chiffres' : 'Choisissez un code à 4 chiffres pour sécuriser l\'application'}</p>
      <div class="pin-dots" id="pinSetupDots">
        <div class="pin-dot" id="psd0"></div>
        <div class="pin-dot" id="psd1"></div>
        <div class="pin-dot" id="psd2"></div>
        <div class="pin-dot" id="psd3"></div>
      </div>
      <div class="pin-error" id="pinSetupError"></div>
      <div class="pin-pad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pin-key" type="button" onclick="pinSetupKey('${n}')">${n}</button>`).join('')}
        ${isChange ? `<button class="pin-key cancel" type="button" onclick="document.getElementById('pinSetupOv').remove()">Annuler</button>` : `<button class="pin-key" type="button" style="visibility:hidden"></button>`}
        <button class="pin-key" type="button" onclick="pinSetupKey('0')">0</button>
        <button class="pin-key del" type="button" onclick="pinSetupDel()">⌫</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
}

function _updateSetupDots(error) {
  for (let i = 0; i < 4; i++) {
    const d = document.getElementById('psd' + i);
    if (d) d.className = 'pin-dot' + (i < _pinEntry.length ? (error ? ' error' : ' filled') : '');
  }
}

async function pinSetupKey(digit) {
  if (_pinEntry.length >= 4) return;
  _pinEntry += digit;
  _updateSetupDots(false);
  if (_pinEntry.length < 4) return;

  if (_pinSetupStep === 1) {
    _pinSetupFirst = _pinEntry;
    _pinEntry = '';
    _pinSetupStep = 2;
    const msg = document.getElementById('pinSetupMsg');
    if (msg) msg.textContent = 'Confirmez votre code PIN';
    _updateSetupDots(false);
  } else {
    if (_pinEntry === _pinSetupFirst) {
      const hash = await sha256(_pinEntry);
      localStorage.setItem('ebanista_pin_hash', hash);
      document.getElementById('pinSetupOv')?.remove();
      _pinSetupStep = 0;
      toast('✓ Code PIN enregistré');
    } else {
      document.getElementById('pinSetupError').textContent = 'Les codes ne correspondent pas — recommencez';
      _updateSetupDots(true);
      setTimeout(() => {
        _pinEntry = '';
        _pinSetupFirst = '';
        _pinSetupStep = 1;
        const msg = document.getElementById('pinSetupMsg');
        if (msg) msg.textContent = 'Entrez votre nouveau code à 4 chiffres';
        _updateSetupDots(false);
        const err = document.getElementById('pinSetupError');
        if (err) err.textContent = '';
      }, 900);
    }
  }
}

function pinSetupDel() {
  if (_pinEntry.length > 0) {
    _pinEntry = _pinEntry.slice(0, -1);
    _updateSetupDots(false);
  }
}

function updatePinDots(error) {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('pd' + i);
    if (!dot) continue;
    dot.className = 'pin-dot' + (i < _pinEntry.length ? (error ? ' error' : ' filled') : '');
  }
}

async function pinKey(digit) {
  if (_pinEntry.length >= 4) return;
  _pinEntry += digit;
  updatePinDots(false);
  if (_pinEntry.length === 4) {
    const storedHash = localStorage.getItem('ebanista_pin_hash');
    if (!storedHash) return;
    const inputHash = await sha256(_pinEntry);
    if (inputHash === storedHash) {
      const cb = _pinCallback;
      closePinModal();
      if (cb) cb();
    } else {
      document.getElementById('pinError').textContent = 'Code incorrect';
      updatePinDots(true);
      setTimeout(() => {
        _pinEntry = '';
        updatePinDots(false);
        const err = document.getElementById('pinError');
        if (err) err.textContent = '';
      }, 800);
    }
  }
}

function pinDel() {
  if (_pinEntry.length > 0) {
    _pinEntry = _pinEntry.slice(0, -1);
    updatePinDots(false);
  }
}

// ─── Google Drive Integration ──────────────────────────
let _driveClientId   = localStorage.getItem('ebanista_gcid')  || '';
let _driveToken      = null;
let _driveTokenExpiry = 0;
let _driveClient     = null;
let _drivePending    = null;

// ── Sync state ──
const DRIVE_DATA_FILE = 'ebanista-data.json';
let _driveSyncFileId  = localStorage.getItem('ebanista_dfid') || null;
let _silentAuthMode   = false;
let _syncStatus       = 'idle'; // 'idle' | 'syncing' | 'ok' | 'error'
let _syncPushTimer    = null;

window.addEventListener('load', () => {
  const poll = setInterval(() => {
    if (window.google?.accounts?.oauth2) {
      clearInterval(poll);
      if (_driveClientId) {
        _initDriveClient();
        setTimeout(driveAutoSync, 1200); // tentative silencieuse au démarrage
      }
    }
  }, 300);
  setTimeout(() => clearInterval(poll), 15000);
});

function _initDriveClient() {
  try {
    _driveClient = google.accounts.oauth2.initTokenClient({
      client_id: _driveClientId,
      scope: 'https://www.googleapis.com/auth/drive.file',
      hint: 'ebanista.atelier@gmail.com',
      callback(resp) {
        if (resp.error) {
          if (!_silentAuthMode) toast('Erreur Google Auth');
          _drivePending    = null;
          _silentAuthMode  = false;
          if (_syncStatus === 'syncing') _setSyncStatus('idle');
          return;
        }
        _silentAuthMode   = false;
        _driveToken       = resp.access_token;
        _driveTokenExpiry = Date.now() + (resp.expires_in - 60) * 1000;
        const cb = _drivePending; _drivePending = null;
        if (cb) cb();
      }
    });
  } catch(e) { console.error('Drive init error', e); }
}

function _driveAuth(cb) {
  if (!_driveClientId) { showDriveSetup(); return; }
  if (_driveToken && Date.now() < _driveTokenExpiry) { cb(); return; }
  if (!_driveClient) { toast('Google Drive non disponible (vérifiez la connexion)'); return; }
  _drivePending = cb;
  _driveToken = null;
  _driveClient.requestAccessToken({ prompt: '' });
}

async function _driveAPI(method, path, body) {
  const opts = {
    method,
    headers: { 'Authorization': 'Bearer ' + _driveToken }
  };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch('https://www.googleapis.com/drive/v3/' + path, opts);
  if (!r.ok) throw new Error('Drive API ' + r.status);
  return r.json();
}

// ─── Drive Sync (centralisation multi-appareils) ────────

function _setSyncStatus(s) {
  _syncStatus = s;
  const dot = document.getElementById('syncDot');
  if (!dot) return;
  const c = { idle:'#8E8E93', syncing:'#FF9500', ok:'#34C759', error:'#FF3B30' };
  dot.style.background = c[s] || c.idle;
  dot.title = { idle:'Non synchronisé', syncing:'Synchronisation…', ok:'Synchronisé', error:'Erreur de synchro' }[s] || '';
}

// Upload (création ou mise à jour du fichier JSON dans Drive)
async function _driveUploadFile(fileId, contentObj) {
  const json = JSON.stringify(contentObj);
  if (fileId) {
    const r = await fetch(
      `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,
      { method:'PATCH', headers:{'Authorization':'Bearer '+_driveToken,'Content-Type':'application/json'}, body:json }
    );
    if (!r.ok) throw new Error('Upload ' + r.status);
    return fileId;
  } else {
    const boundary = 'ebanista_' + Date.now();
    const meta = JSON.stringify({ name: DRIVE_DATA_FILE, mimeType: 'application/json' });
    const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${json}\r\n--${boundary}--`;
    const r = await fetch(
      'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',
      { method:'POST', headers:{'Authorization':'Bearer '+_driveToken,'Content-Type':`multipart/related; boundary="${boundary}"`}, body }
    );
    if (!r.ok) throw new Error('Create ' + r.status);
    const data = await r.json();
    _driveSyncFileId = data.id;
    localStorage.setItem('ebanista_dfid', data.id);
    return data.id;
  }
}

// Téléchargement du contenu du fichier JSON
async function _driveDownloadFile(fileId) {
  const r = await fetch(
    `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
    { headers: { 'Authorization': 'Bearer ' + _driveToken } }
  );
  if (!r.ok) throw new Error('Download ' + r.status);
  return r.json();
}

// Recherche du fichier de données dans Drive
async function _findDataFile() {
  const q = encodeURIComponent(`name='${DRIVE_DATA_FILE}' and trashed=false`);
  const data = await _driveAPI('GET', `files?q=${q}&fields=files(id)&pageSize=1`);
  return data.files?.[0]?.id || null;
}

// PULL : Drive → cet appareil (source de vérité = Drive)
async function drivePull() {
  if (!_driveClientId || !_driveToken) return false;
  try {
    _setSyncStatus('syncing');
    if (!_driveSyncFileId) {
      _driveSyncFileId = await _findDataFile();
      if (_driveSyncFileId) localStorage.setItem('ebanista_dfid', _driveSyncFileId);
    }
    if (!_driveSyncFileId) {
      // Pas encore de fichier — on crée avec l'état actuel
      await drivePush(true);
      return false;
    }
    const remote = await _driveDownloadFile(_driveSyncFileId);
    if (remote?.projects) {
      // ── 1. Fusionner les tombstones (suppressions) des deux côtés ──
      const mergedDeleted = Object.assign({}, state.deletedIds, remote.deletedIds || {});
      state.deletedIds = mergedDeleted;

      // ── 2. Merge projet-par-projet via updatedAt ──
      // Pour chaque projet présent sur au moins un côté :
      //   - Si supprimé (tombstone) → ignorer
      //   - Si présent des deux côtés → garder le plus récent (updatedAt)
      //   - Si seulement en remote → ajouter au local
      //   - Si seulement en local → conserver (créé hors connexion)
      const remoteMap = {};
      remote.projects.forEach(p => remoteMap[p.id] = p);
      const localMap = {};
      state.projects.forEach(p => localMap[p.id] = p);
      const allIds = new Set([...Object.keys(remoteMap), ...Object.keys(localMap)]);

      let localWins = 0;
      const merged = [];
      for (const id of allIds) {
        if (mergedDeleted[id]) continue;
        const rp = remoteMap[id];
        const lp = localMap[id];
        if (rp && lp) {
          const rTs = rp.updatedAt || rp.createdAt || 0;
          const lTs = lp.updatedAt || lp.createdAt || 0;
          if (lTs > rTs) { merged.push(lp); localWins++; }
          else            { merged.push(rp); }
        } else if (rp) {
          merged.push(rp);
        } else if (lp) {
          merged.push(lp); localWins++;
        }
      }

      state.projects = merged;
      state.projects.forEach(ensureJalons);
      state.lastModified = remote.lastModified || Date.now();
      try {
        localStorage.setItem('ebanista_v1', JSON.stringify(state.projects));
        localStorage.setItem('ebanista_v1_ts', state.lastModified);
        localStorage.setItem('ebanista_v1_del', JSON.stringify(state.deletedIds));
      } catch(e) {}
      render();
      localStorage.setItem('ebanista_last_sync', Date.now());

      // ── 3. Pousser si des projets locaux sont plus récents ou tombstones à propager ──
      const extraTombstones = Object.keys(mergedDeleted).length > Object.keys(remote.deletedIds || {}).length;
      if (localWins > 0 || extraTombstones) {
        state.lastModified = Date.now();
        localStorage.setItem('ebanista_v1_ts', state.lastModified);
        await drivePush(true);
      } else {
        _setSyncStatus('ok');
      }
      toast('☁️ Projets synchronisés');
      return true;
    }
    _setSyncStatus('ok');
    return false;
  } catch(e) {
    console.error('Drive pull', e);
    if (_driveSyncFileId && /40[04]/.test(e.message)) {
      // ID périmé — on réessaie sans ID
      _driveSyncFileId = null; localStorage.removeItem('ebanista_dfid');
      try { return await drivePull(); } catch(e2) {}
    }
    _setSyncStatus('error');
    return false;
  }
}

// PUSH : cet appareil → Drive (avec debounce 2 s)
async function drivePush(force = false) {
  if (!_driveClientId || !_driveToken) return;
  if (!force) {
    clearTimeout(_syncPushTimer);
    _syncPushTimer = setTimeout(() => drivePush(true), 2000);
    return;
  }
  try {
    _setSyncStatus('syncing');
    // Avant de pousser, récupérer les tombstones Drive pour ne pas les écraser
    if (_driveSyncFileId) {
      try {
        const remote = await _driveDownloadFile(_driveSyncFileId);
        if (remote?.deletedIds) {
          // Fusionner les tombstones Drive dans l'état local
          state.deletedIds = Object.assign({}, state.deletedIds, remote.deletedIds);
          // Appliquer les tombstones : retirer les projets supprimés sur d'autres appareils
          state.projects = state.projects.filter(p => !state.deletedIds[p.id]);
          localStorage.setItem('ebanista_v1', JSON.stringify(state.projects));
          localStorage.setItem('ebanista_v1_del', JSON.stringify(state.deletedIds));
        }
      } catch(e) { /* si la lecture échoue on pousse quand même */ }
    }
    _driveSyncFileId = await _driveUploadFile(_driveSyncFileId, { projects: state.projects, deletedIds: state.deletedIds || {}, lastModified: state.lastModified || Date.now() });
    localStorage.setItem('ebanista_last_sync', Date.now());
    _setSyncStatus('ok');
  } catch(e) {
    console.error('Drive push', e);
    if (_driveSyncFileId && /40[04]/.test(e.message)) {
      _driveSyncFileId = null; localStorage.removeItem('ebanista_dfid');
      try { await drivePush(true); } catch(e2) { _setSyncStatus('error'); }
    } else { _setSyncStatus('error'); }
  }
}

// Détection iOS — prompt:'none' bloque les iframes cross-origin sur Safari/iOS
function _isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

// Tentative de synchronisation silencieuse au démarrage (desktop uniquement)
function driveAutoSync() {
  if (!_driveClientId || !_driveClient) return;
  if (_isIOS()) return; // sur iPad : sync manuel via le bouton Drive
  _drivePending   = () => drivePull();
  _silentAuthMode = true;
  try { _driveClient.requestAccessToken({ prompt: 'none' }); }
  catch(e) { _drivePending = null; _silentAuthMode = false; }
}

function printProject(id) {
  save();
  const p = getProject(id);
  if (!p) return;

  const id_ = p.identification;
  const ps  = p.pose;

  const code    = projectRef(p);
  const client  = id_.client           || '';
  const projet  = id_.nomProjet        || code;
  const adresse = id_.adresseChantier  || '';
  const respId  = id_.responsablePose  || '';

  const today = new Date().toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' });
  const fmt = d => d ? new Date(d).toLocaleDateString('fr-FR') : '—';

  const poseOk = getJalons(p).posee;

  // ── Réserves ──
  const hasReserves = ps.reservesEmises || (ps.reserves || '').trim() || (ps.reservesClient || '').trim();
  const reservesHTML = hasReserves ? `
    <div class="bl-reserves-box"><strong>Réserves EBANISTA :</strong><br>${(ps.reserves||'—').replace(/\n/g,'<br>')}</div>
    <div class="bl-reserves-box"><strong>Réserves client :</strong><br>${(ps.reservesClient||'—').replace(/\n/g,'<br>')}</div>
    <p style="font-size:9.5pt;color:#555;margin-top:4px">Les réserves mentionnées ci-dessus devront être levées dans un délai à convenir entre les parties.</p>
  ` : `<div class="bl-sans-reserve">✓ Aucune réserve — travaux réceptionnés conformes</div>`;

  // ── Suivi installation ──
  const suiviHTML =
    `<div class="bl-check-row"><span class="bl-check">${poseOk ? '☑' : '☐'}</span> Travaux d'installation réalisés conformément aux plans</div>`;

  // ── Déclaration ──
  const clientNom = ps.client2 || '____________________________';
  const decl = hasReserves
    ? `Je soussigné(e) <strong>${clientNom}</strong>, représentant(e) du maître d'ouvrage, reconnais avoir réceptionné ce jour les travaux d'installation décrits ci-dessus, réalisés par <strong>EBANISTA</strong>, sous réserve des points mentionnés dans la section « Réserves » ci-dessus.`
    : `Je soussigné(e) <strong>${clientNom}</strong>, représentant(e) du maître d'ouvrage, reconnais avoir réceptionné ce jour les travaux d'installation décrits ci-dessus, réalisés par <strong>EBANISTA</strong>, <strong>sans réserve</strong>.`;

  const html = `
  <div class="bl-header">
    <div class="bl-logo">
      <strong>EBANISTA</strong>
      Menuiserie d'agencement<br>
      Valaurie — Drôme
    </div>
    <div class="bl-doc-title">
      <h1>Bon de réception de travaux</h1>
      <p>Réf. ${code} &nbsp;|&nbsp; ${today}</p>
    </div>
  </div>

  <table class="bl-parties">
    <tr>
      <td><strong>Entreprise</strong>EBANISTA<br>Menuiserie &amp; Ébénisterie<br>Valaurie, 26230 Drôme</td>
      <td><strong>Client / Maître d'ouvrage</strong>${client}<br>${adresse}</td>
    </tr>
  </table>

  <div class="bl-section">
    <div class="bl-section-title">Désignation des travaux</div>
    <div class="bl-info-grid">
      <div class="bl-info-row"><span class="bl-info-label">Projet :</span><span>${projet}</span></div>
      <div class="bl-info-row"><span class="bl-info-label">Responsable pose :</span><span>${ps.respPose || respId || '—'}</span></div>
      <div class="bl-info-row"><span class="bl-info-label">Chantier :</span><span>${adresse || '—'}</span></div>
      <div class="bl-info-row"><span class="bl-info-label">Date début :</span><span>${fmt(ps.dateDebut)}</span></div>
      <div class="bl-info-row"><span class="bl-info-label">Équipe :</span><span>${ps.typeEquipe}${ps.nomEntrepriseST ? ' — ' + ps.nomEntrepriseST : ''}</span></div>
      <div class="bl-info-row"><span class="bl-info-label">Date fin :</span><span>${fmt(ps.dateFin)}</span></div>
    </div>
  </div>

  <div class="bl-section">
    <div class="bl-section-title">Prestations réalisées</div>
    ${suiviHTML}
  </div>

  <div class="bl-section">
    <div class="bl-section-title">Réserves et non-conformités</div>
    ${reservesHTML}
  </div>

  <div class="bl-section">
    <div class="bl-section-title">Déclaration de réception</div>
    <div class="bl-declaration">${decl}</div>
  </div>

  <div class="bl-signatures">
    <div class="bl-sig-block">
      <div class="bl-sig-title">Responsable pose — EBANISTA</div>
      <div class="bl-sig-info">Nom : ${ps.respPose || ''}</div>
      <div class="bl-sig-info">Date : ${ps.respPoseDate ? fmt(ps.respPoseDate) : ''}</div>
      <div class="bl-sig-label">Signature :</div>
      <div class="bl-sig-box"></div>
    </div>
    <div class="bl-sig-block">
      <div class="bl-sig-title">Client / Représentant du maître d'ouvrage</div>
      <div class="bl-sig-info">Nom : ${ps.client2 || ''}</div>
      <div class="bl-sig-info">Date : ${ps.clientDate ? fmt(ps.clientDate) : ''}</div>
      <div class="bl-sig-label">Signature et cachet :</div>
      <div class="bl-sig-box"></div>
    </div>
  </div>

  <div class="bl-footer">
    Document généré par Ebanista Production le ${today} &nbsp;·&nbsp; ${code} &nbsp;·&nbsp; Original à retourner signé à EBANISTA
  </div>`;

  document.title = [code, client, 'Bon de réception'].filter(Boolean).join(' — ');

  const prev = document.getElementById('bonLivraison');
  if (prev) prev.remove();
  const div = document.createElement('div');
  div.id = 'bonLivraison';
  div.innerHTML = html;
  document.body.appendChild(div);

  const onAfterPrint = () => {
    div.remove();
    document.title = 'Ebanista — Production';
    window.removeEventListener('afterprint', onAfterPrint);
  };
  window.addEventListener('afterprint', onAfterPrint);
  window.print();
}

// ═══ INIT ══════════════════════════════════════════════
load();
render();

// Premier lancement : PIN non défini → écran de création
if (!localStorage.getItem('ebanista_pin_hash')) {
  showPinSetupOverlay(false);
}

// Register Service Worker for offline use
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// Auto-save on leave
window.addEventListener('beforeunload', save);
window.addEventListener('pagehide', save);
</script>
</body>
</html>
